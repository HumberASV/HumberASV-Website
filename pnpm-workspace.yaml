allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - experimental-visualizer@1.0.0
  - visualizer-components@0.2.0 || 0.3.0
  - react-isometric-engine@1.1.1
  - globals@17.12.0
overrides:
  # react-isometric-engine@1.0.0 was published with its isometric-physics dep
  # still pointing at a local path ("file:../isometric-physics"), which makes it
  # uninstallable from npm. Redirect the nested dep to the published version.
  # Remove this once a fixed react-isometric-engine is published.
  react-isometric-engine>isometric-physics: ^1.0.2
